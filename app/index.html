<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猫街ろまん 〜Cat city Romance〜</title>
<meta name="description" content="猫街ろまん：ねこと 飼い主の 日常ゲーム。一週間モードで ハイスコアを めざすか、エンドレスモードで のんびり おせわ">
<meta name="theme-color" content="#2f5d3a">

<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="猫街ろまん">

<link rel="stylesheet" href="week.css">
<link rel="canonical" href="https://pikaring.github.io/tap-on-neko/app/">
</head>
<body>

  <!-- ===== ヘッダー：曜日・じかん・てんすう ===== -->
  <header class="wk-header" id="wkHeader" hidden>
    <div class="wk-days" id="wkDays" aria-hidden="true"></div>
    <div class="wk-status">
      <span class="wk-time" id="wkTime">あさ</span>
      <span class="wk-score"><span class="wk-score__label">てんすう</span> <b id="wkScore">0</b></span>
    </div>
  </header>

  <!-- ===== ぶたい：背景・立ち絵・ねこ ===== -->
  <main class="wk-stage" id="wkStage">
    <div class="wk-bg" id="wkBg"></div>
    <div class="wk-fig wk-fig--left" id="wkFigLeft" aria-hidden="true"></div>
    <div class="wk-fig wk-fig--right" id="wkFigRight" aria-hidden="true"></div>
    <div class="wk-cat" id="wkCat" aria-hidden="true" hidden></div>
    <div class="wk-arena" id="wkArena" hidden></div>
  </main>

  <!-- ===== したの まど：台詞 または メニュー・ミニゲーム ===== -->
  <section class="wk-bottom" id="wkBottom">
    <button type="button" class="wk-window" id="wkWindow" hidden>
      <span class="wk-window__name" id="wkName"></span>
      <span class="wk-window__text" id="wkText" aria-live="polite"></span>
      <span class="wk-window__next" aria-hidden="true">▼</span>
    </button>
    <div class="wk-panel" id="wkPanel"></div>
  </section>

  <script src="questions-kotoba.js"></script>
  <script src="week-data.js"></script>
  <script src="week.js"></script>
</body>
</html>
